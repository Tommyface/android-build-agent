name: publish

# 触发方式：
#   1. push 形如 v1.0.1 的 tag
#   2. 手动 workflow_dispatch
#
# 走 PyPI 的 Trusted Publishing（OIDC，无需 API Token）：
#   在 https://pypi.org/manage/account/publishing/ 添加
#     Owner: Tommyface
#     Repository: android-build-agent
#     Workflow: publish.yml
#     Environment: pypi
#   首次发布前，也可以在 PyPI 建一个「待发布」记录（pending publisher），发布成功后自动转正。

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 包元数据一致性（版本号两处对齐、__init__.py 非空）
        run: python tests/test_metadata.py

      - name: 构建
        run: python -m build

      - name: 检查产物
        run: |
          ls -l dist/
          python -c "import zipfile,glob; w=glob.glob('dist/*.whl')[0]; print('wheel entries:'); [print(' ', n) for n in zipfile.ZipFile(w).namelist()]"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: 发布到 PyPI
    needs: build
    # 在仓库 Settings → Secrets and variables → Actions → Variables 里加 PYPI_ENABLED=true 才会真正发布
    if: vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing 必需
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
