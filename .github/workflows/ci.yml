name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（无第三方依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 语法检查
        run: python -m compileall -q android_build_agent tests

      - name: 单元测试（配置 / 白名单 / 工具函数）
        run: python tests/test_config.py

      - name: MCP 冒烟测试（真实 stdio 握手）
        run: python tests/smoke_mcp.py

      - name: CLI 冒烟测试
        run: |
          android-build-agent list --json > out.json
          python -c "import json;d=json.load(open('out.json',encoding='utf-8'));assert d['ok'] is True,d;assert d['count']>=1,d;print('cli ok, profiles =',[p['name'] for p in d['profiles']])"

      - name: 安全边界回归（注入型 task 必须被拒）
        run: |
          set +e
          android-build-agent build shiye --task 'assembleDebug && whoami' --json > bad.json
          code=$?
          set -e
          cat bad.json
          test "$code" -ne 0
          python -c "import json;d=json.load(open('bad.json',encoding='utf-8'));assert d['ok'] is False,d;assert '非法字符' in d['error'],d;print('injection blocked ok')"
