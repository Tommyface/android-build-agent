[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "android-build-agent"
version = "1.0.3"
description = "把 Android 构建能力以 MCP / CLI 形式暴露给 AI Agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tommyface" }]
keywords = ["android", "gradle", "mcp", "agent", "build"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Tommyface/android-build-agent"
Repository = "https://github.com/Tommyface/android-build-agent"
Issues = "https://github.com/Tommyface/android-build-agent/issues"

[project.scripts]
android-build-agent = "android_build_agent.cli:main"
android-build-agent-mcp = "android_build_agent.mcp_server:main"

[tool.setuptools]
packages = ["android_build_agent"]
